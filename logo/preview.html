<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 40px;
            font-size: 2rem;
            font-weight: 600;
        }

        .logo-display {
            background: #fafaf8;
            padding: 60px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: inline-block;
        }

        .logo-display svg {
            display: block;
            width: 264px;
            height: auto;
        }

        /* Two outline states that crossfade */
        #outline-infinity {
            opacity: 1;
            transition: opacity 0.6s ease;
        }

        #outline-compact {
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .logo-display:hover #outline-infinity {
            opacity: 0;
        }

        .logo-display:hover #outline-compact {
            opacity: 1;
        }


        .info {
            margin-top: 30px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Logo Preview</h1>
        <div class="logo-display">
            <svg width="88" height="56" viewBox="0 0 88 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Layer 1: Base - White rounded rectangle background (88x56) -->
                <rect id="logo-base" width="88" height="56" rx="28" fill="white"/>

                <!-- Layer 2: Two outline states that crossfade -->
                <g transform="translate(4, 4)">
                    <!-- Infinity outline (default) -->
                    <path id="outline-infinity" fill="none" stroke="black" stroke-width="4"
                          d="M 24 2 C 11.8497 2 2 11.8497 2 24 C 2 36.1503 11.8497 46 24 46 C 30.083 46 35.6364 43.7358 39.8662 40.0056 C 40.0574 39.9382 39.9426 39.9382 40.1338 40.0056 C 44.3636 43.7358 49.917 46 56 46 C 68.1503 46 78 36.1503 78 24 C 78 11.8497 68.1503 2 56 2 C 49.9172 2 44.3636 4.26353 40.1338 7.99342 C 39.9426 8.06082 40.0574 8.06082 39.8662 7.99342 C 35.6364 4.26353 30.0828 2 24 2 Z"/>

                    <!-- Compact pill outline (shows on hover) -->
                    <path id="outline-compact" fill="none" stroke="black" stroke-width="4"
                          d="M 28 2 C 15.8497 2 6 11.8497 6 24 C 6 36.1503 15.8497 46 28 46 L 52 46 C 64.1503 46 74 36.1503 74 24 C 74 11.8497 64.1503 2 52 2 L 28 2 Z"/>
                </g>

                <!-- Layer 3: Face 1 - White face (32x32, positioned at left circle center) -->
                <g id="logo-face-1" transform="translate(12, 12)">
                    <circle cx="16" cy="16" r="16" fill="white"/>
                    <circle cx="10" cy="10" r="2" fill="black"/>
                    <circle cx="22" cy="10" r="2" fill="black"/>
                    <path d="M10 24C10 20.6863 12.6863 18 16 18C19.3137 18 22 20.6863 22 24" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
                </g>

                <!-- Layer 4: Face 2 - Black face (32x32, positioned at right circle center) -->
                <g id="logo-face-2" transform="translate(44, 12)">
                    <circle cx="16" cy="16" r="16" fill="black"/>
                    <circle cx="10" cy="10" r="2" fill="white"/>
                    <circle cx="22" cy="10" r="2" fill="white"/>
                    <path d="M22 18C22 21.3137 19.3137 24 16 24C12.6863 24 10 21.3137 10 18" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                </g>
            </svg>
        </div>
        <p class="info">Hover to see outline morph and compact</p>
    </div>

</body>
</html>
